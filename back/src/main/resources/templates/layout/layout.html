<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title layout:title-pattern="$CONTENT_TITLE - 커뮤니티 게시판">커뮤니티 게시판</title>

    <!-- Pretendard 다이나믹 서브셋 -->
    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"/>
    <!-- DaisyUI 5 -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>
    <!-- Tailwind 4 Play CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        :root {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-base-100">
<header class="navbar bg-base-200 px-4">
    <div class="flex-1">
        <a th:href="@{/}" class="btn btn-ghost text-xl">커뮤니티 게시판</a>
    </div>
    <div class="flex-none gap-2">
        <a sec:authorize="isAnonymous()" th:href="@{/member/login}" class="btn btn-sm">로그인</a>
        <a sec:authorize="isAnonymous()" th:href="@{/member/signup}" class="btn btn-sm btn-primary">회원가입</a>
        <span sec:authorize="isAuthenticated()" class="text-sm" sec:authentication="name">user</span>
        <form sec:authorize="isAuthenticated()" th:action="@{/member/logout}" method="post" class="inline">
            <button type="submit" class="btn btn-sm">로그아웃</button>
        </form>
    </div>
</header>

<main class="container mx-auto p-4" layout:fragment="content">
    <!-- 페이지 내용이 여기에 들어감 -->
</main>
</body>
</html>
