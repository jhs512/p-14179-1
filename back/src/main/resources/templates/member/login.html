<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>로그인</title>
</head>
<body>
<section layout:fragment="content">
    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold mb-4">로그인</h1>

        <div th:if="${param.error}" class="alert alert-error mb-4">
            <span>아이디 또는 비밀번호가 올바르지 않습니다.</span>
        </div>
        <div th:if="${param.logout}" class="alert alert-success mb-4">
            <span>로그아웃되었습니다.</span>
        </div>

        <form th:action="@{/member/login}" method="post" class="space-y-3">
            <div>
                <label class="label" for="username">아이디</label>
                <input type="text" id="username" name="username" class="input input-bordered w-full"/>
            </div>
            <div>
                <label class="label" for="password">비밀번호</label>
                <input type="password" id="password" name="password" class="input input-bordered w-full"/>
            </div>
            <button type="submit" class="btn btn-primary w-full">로그인</button>
        </form>
        <p class="mt-4 text-sm">계정이 없나요? <a th:href="@{/member/signup}" class="link">회원가입</a></p>
    </div>
</section>
</body>
</html>
