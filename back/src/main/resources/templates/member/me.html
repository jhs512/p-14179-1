<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>내 정보</title>
</head>
<body>
<section layout:fragment="content">
    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold mb-4">내 정보</h1>

        <form th:action="@{/member/me}" th:object="${myInfoForm}" method="post" class="space-y-3">
            <div>
                <label class="label">아이디</label>
                <input type="text" th:value="${member.username}" class="input input-bordered w-full" readonly disabled/>
            </div>
            <div>
                <label class="label" for="nickname">닉네임</label>
                <input type="text" id="nickname" th:field="*{nickname}" class="input input-bordered w-full"/>
                <p class="text-error text-sm" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}">에러</p>
            </div>
            <div>
                <label class="label" for="password">새 비밀번호 (변경 시에만 입력)</label>
                <input type="password" id="password" th:field="*{password}" class="input input-bordered w-full"/>
                <p class="text-error text-sm" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">에러</p>
            </div>
            <button type="submit" class="btn btn-primary w-full">저장</button>
        </form>
    </div>
</section>
</body>
</html>
